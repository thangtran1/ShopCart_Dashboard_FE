<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var backendUrl = "%VITE_API_URL%" || "http://localhost:5000";
        var maintenanceUrl = "%VITE_API_URL_MAINTENANCE%" || "http://localhost:3001";
        
        fetch(backendUrl + "/maintenance/current-status")
          .then(function(res) { return res.json(); })
          .then(function(res) {
            if (res && res.success && res.data && res.data.isUnderMaintenance) {
              window.location.href = maintenanceUrl;
            } else {
              var preloader = document.getElementById("maintenance-preloader");
              if (preloader) preloader.style.display = "none";
            }
          })
          .catch(function(err) {
            console.error("Maintenance check failed:", err);
            var preloader = document.getElementById("maintenance-preloader");
            if (preloader) preloader.style.display = "none";
          });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TVT Admin</title>
  
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shop-cart-dashboard-fe.vercel.app/" />
    <meta property="og:title" content="TVT Admin - Hệ Thống Quản Lý" />
    <meta property="og:description" content="Nền tảng quản lý chuyên nghiệp cho cửa hàng của bạn." />
    
    <meta property="og:image" content="https://vcdn1-dulich.vnecdn.net/2021/07/16/1-1626437591.jpg?w=460&h=0&q=100&dpr=2&fit=crop&s=i2M2IgCcw574LT-bXFY92g" />
  
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TVT Admin" />
    <meta name="twitter:description" content="Nền tảng quản lý chuyên nghiệp." />
    
    <meta name="twitter:image" content="https://vcdn1-dulich.vnecdn.net/2021/07/16/1-1626437591.jpg?w=460&h=0&q=100&dpr=2&fit=crop&s=i2M2IgCcw574LT-bXFY92g" />
  </head>
  <body>
    <!-- Preloader to cover page while checking maintenance status -->
    <div id="maintenance-preloader" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #ffffff; display: flex; align-items: center; justify-content: center; z-index: 999999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; flex-direction: column;">
      <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #1677ff; border-radius: 50%; animation: maintenance-spin 1s linear infinite;"></div>
      <div style="margin-top: 16px; color: #4b5563; font-size: 14px; font-weight: 500;">Đang kết nối hệ thống...</div>
    </div>
    <style>
      @keyframes maintenance-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
